<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Lạc Bước Bí Cảnh | ZIN.ZONE</title>
  <meta name="theme-color" content="#070b14">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="css/app.css?v=20261021_v1">
  <style>
    :root {
      background-color: #070b14;
      color: #f8fafc;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #070b14 70%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="text-slate-200 antialiased selection:bg-amber-500 selection:text-slate-950">

  <main class="w-full max-w-md mx-auto text-center flex flex-col items-center">
    <!-- Icon / Badge -->
    <div class="relative mb-6">
      <div class="w-24 h-24 rounded-3xl bg-slate-900 border border-amber-500/30 flex items-center justify-center shadow-2xl shadow-amber-500/10">
        <span class="text-5xl select-none">🧭</span>
      </div>
      <span class="absolute -top-2 -right-2 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-xs tracking-wider uppercase shadow-md">
        404
      </span>
    </div>

    <!-- Title & Explanation -->
    <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 tracking-tight mb-2">
      Lạc Bước Bí Cảnh
    </h1>
    <p class="text-sm text-slate-400 leading-relaxed max-w-sm mb-6">
      Trang bạn đang tìm kiếm không tồn tại, đường dẫn đã thay đổi hoặc tọa độ tu chân này đã được quy hoạch lại.
    </p>

    <!-- Action Buttons -->
    <div class="w-full space-y-3">
      <a href="/" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-400 text-slate-950 font-black text-sm tracking-wide shadow-lg shadow-amber-500/25 flex items-center justify-center gap-2 transition transform active:scale-95 hover:brightness-105">
        <span>⚡ Quay Về Tu Luyện Ngay</span>
      </a>

      <a href="/pocket-cards.html" class="w-full py-3 px-6 rounded-2xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700 font-bold text-xs flex items-center justify-center gap-2 transition active:scale-95">
        <span>📇 Xem Thẻ Bỏ Túi Nhà Xưởng</span>
      </a>
    </div>

    <!-- Countdown Redirect Notice -->
    <p class="mt-8 text-xs text-slate-500 flex items-center justify-center gap-1.5">
      <span>Tự động chuyển về trang chủ sau</span>
      <span id="countdownText" class="font-bold text-amber-400">8</span>
      <span>giây...</span>
    </p>

    <footer class="mt-12 text-[11px] text-slate-600">
      ZIN.ZONE • Thần Ngữ Tu Chân Ký © 2026
    </footer>
  </main>

  <script>
    let secondsLeft = 8;
    const countEl = document.getElementById('countdownText');
    const interval = setInterval(function() {
      secondsLeft--;
      if (countEl) countEl.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
